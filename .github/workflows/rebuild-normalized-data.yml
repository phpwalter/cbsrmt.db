name: Rebuild normalized CBSRMT data

on:
  push:
    branches:
      - normalize-relational-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild normalized data
        run: python tools/rebuild_data.py

      - name: Validate generated artifacts
        run: python tools/validate_data.py

      - name: Import rebuilt database into MySQL
        run: mysql -h 127.0.0.1 -uroot -proot < sql/cbs.sql

      - name: Run relational integrity queries
        run: |
          mysql -h 127.0.0.1 -uroot -proot cbs <<'SQL'
          SELECT COUNT(*) AS invalid_genres
          FROM episodes e LEFT JOIN genre g ON g.genre_id = e.genre_id
          WHERE g.genre_id IS NULL;

          SELECT COUNT(*) AS invalid_appear
          FROM appear a
          LEFT JOIN episodes e ON e.episode_id = a.episode_id
          LEFT JOIN cast c ON c.cast_id = a.cast_id
          WHERE e.episode_id IS NULL OR c.cast_id IS NULL;

          SELECT COUNT(*) AS invalid_writers
          FROM episode_writers ew
          LEFT JOIN episodes e ON e.episode_id = ew.episode_id
          LEFT JOIN cast c ON c.cast_id = ew.cast_id
          WHERE e.episode_id IS NULL OR c.cast_id IS NULL;

          SELECT COUNT(*) AS invalid_adaptations
          FROM episode_adaptations ea
          LEFT JOIN episodes e ON e.episode_id = ea.episode_id
          WHERE e.episode_id IS NULL;
          SQL

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports sql/cbs.sql
          git commit -m "data: rebuild normalized CBSRMT artifacts [skip ci]"
          git push origin HEAD:normalize-relational-model
